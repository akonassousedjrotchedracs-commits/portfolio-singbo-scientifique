<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t d"><title id="t">Disk diffusion method schematic</title><desc id="d">Conceptual agar plate, bacterial lawn, antimicrobial disks, inhibition zones and diameter measurement. Not a laboratory result.</desc><rect width="100%" height="100%" fill="#fff"/><text x="35" y="38" font-family="Arial" font-size="22" font-weight="bold" fill="#153b52">Antibiogramme par diffusion en disque - schema de lecture</text><text x="35" y="63" font-family="Arial" font-size="13" fill="#59686e">Illustration conceptuelle sans mesure experimentale; appliquer la methode et les QC en vigueur.</text><circle cx="260" cy="235" r="145" fill="#e6f0d9" stroke="#7d9b67" stroke-width="5"/><circle cx="260" cy="235" r="118" fill="#eef5e8" stroke="#b7c89f" stroke-width="1"/><circle cx="208" cy="178" r="37" fill="none" stroke="#72a7bd" stroke-width="3"/><circle cx="208" cy="178" r="7" fill="#fff" stroke="#153b52" stroke-width="2"/><text x="185" y="183" font-family="Arial" font-size="10" fill="#153b52">A</text><circle cx="311" cy="177" r="29" fill="none" stroke="#72a7bd" stroke-width="3"/><circle cx="311" cy="177" r="7" fill="#fff" stroke="#153b52" stroke-width="2"/><text x="303" y="181" font-family="Arial" font-size="10" fill="#153b52">B</text><circle cx="258" cy="276" r="46" fill="none" stroke="#72a7bd" stroke-width="3"/><circle cx="258" cy="276" r="7" fill="#fff" stroke="#153b52" stroke-width="2"/><text x="250" y="280" font-family="Arial" font-size="10" fill="#153b52">C</text><line x1="171" y1="178" x2="245" y2="178" stroke="#b44b3c" stroke-width="2"/><line x1="171" y1="170" x2="171" y2="186" stroke="#b44b3c" stroke-width="2"/><line x1="245" y1="170" x2="245" y2="186" stroke="#b44b3c" stroke-width="2"/><text x="187" y="164" font-family="Arial" font-size="12" fill="#9b3e32">diametre (mm)</text><text x="465" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#153b52">Ce que represente le schema</text><text x="465" y="158" font-family="Arial" font-size="14" fill="#374151">1. Tapis bacterien homogene sur agar valide</text><text x="465" y="190" font-family="Arial" font-size="14" fill="#374151">2. Disques avec concentrations normalisees</text><text x="465" y="222" font-family="Arial" font-size="14" fill="#374151">3. Zones mesurees selon la methode standard</text><text x="465" y="254" font-family="Arial" font-size="14" fill="#374151">4. Interpretation par espece, molecule et seuil</text><text x="465" y="304" font-family="Arial" font-size="13" fill="#59686e">La zone seule ne classe pas S/I/R sans la table de seuils</text><text x="465" y="326" font-family="Arial" font-size="13" fill="#59686e">adaptee et les controles de qualite acceptes.</text></svg>