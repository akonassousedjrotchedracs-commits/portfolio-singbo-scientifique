<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Résistance descriptive par couple organisme antibiotique</title><desc id="desc">Cinq barres montrent 30, 55, 40, 20 et 35 pour cent sur 100 observations synthétiques.</desc><rect width="900" height="480" fill="#fffdf8"/><text x="50" y="42" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#18242b">Résistance descriptive par couple organisme–antibiotique</text><text x="50" y="72" font-family="Arial,sans-serif" font-size="15" fill="#5b6870">Proportion de résultats R sur 20 observations par couple</text><g stroke="#d8d5cc" stroke-width="1"><line x1="90" y1="390" x2="850" y2="390"/><line x1="90" y1="300" x2="850" y2="300"/><line x1="90" y1="210" x2="850" y2="210"/><line x1="90" y1="120" x2="850" y2="120"/></g><g font-family="Arial,sans-serif" font-size="13" fill="#5b6870"><text x="55" y="395">0%</text><text x="48" y="305">25%</text><text x="48" y="215">50%</text><text x="48" y="125">75%</text></g><g fill="#b45a32"><rect x="130" y="282" width="90" height="108"/><rect x="275" y="192" width="90" height="198"/><rect x="420" y="246" width="90" height="144"/><rect x="565" y="318" width="90" height="72"/><rect x="710" y="264" width="90" height="126"/></g><g font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#7d3b25"><text x="175" y="270">30%</text><text x="320" y="180">55%</text><text x="465" y="234">40%</text><text x="610" y="306">20%</text><text x="755" y="252">35%</text></g><g font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#18242b"><text x="175" y="415">E. coli</text><text x="175" y="434">Ceftriaxone</text><text x="320" y="415">E. coli</text><text x="320" y="434">Ciprofloxacin</text><text x="465" y="415">K. pneumoniae</text><text x="465" y="434">Ceftriaxone</text><text x="610" y="415">K. pneumoniae</text><text x="610" y="434">Ciprofloxacin</text><text x="755" y="415">S. aureus</text><text x="755" y="434">Cefoxitin</text></g></svg>
