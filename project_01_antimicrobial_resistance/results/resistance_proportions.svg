<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Synthetic antimicrobial resistance proportions</title>
<desc id="desc">Five synthetic organism-antibiotic pairs with 20 records per pair.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<text x="55" y="55" font-family="Arial" font-size="26" font-weight="700" fill="#153b52">Antimicrobial resistance proportions</text>
<text x="55" y="88" font-family="Arial" font-size="16" fill="#59686e">Synthetic dataset · denominators shown · no clinical inference</text>
<line x1="365.0" y1="125" x2="365.0" y2="515" stroke="#d7e1e4"/>
<text x="365.0" y="118" text-anchor="middle" font-family="Arial" font-size="13" fill="#59686e">0%</text>
<line x1="553.8" y1="125" x2="553.8" y2="515" stroke="#d7e1e4"/>
<text x="553.8" y="118" text-anchor="middle" font-family="Arial" font-size="13" fill="#59686e">25%</text>
<line x1="742.5" y1="125" x2="742.5" y2="515" stroke="#d7e1e4"/>
<text x="742.5" y="118" text-anchor="middle" font-family="Arial" font-size="13" fill="#59686e">50%</text>
<line x1="931.2" y1="125" x2="931.2" y2="515" stroke="#d7e1e4"/>
<text x="931.2" y="118" text-anchor="middle" font-family="Arial" font-size="13" fill="#59686e">75%</text>
<line x1="1120.0" y1="125" x2="1120.0" y2="515" stroke="#d7e1e4"/>
<text x="1120.0" y="118" text-anchor="middle" font-family="Arial" font-size="13" fill="#59686e">100%</text>
<text x="347" y="171" text-anchor="end" font-family="Arial" font-size="17" fill="#153b52">Escherichia coli · Ceftriaxone</text>
<rect x="365" y="144" width="755" height="30" rx="4" fill="#eef6f7"/>
<rect x="365" y="144" width="226.5" height="30" rx="4" fill="#087e8b"/>
<text x="601.5" y="166" font-family="Arial" font-size="15" font-weight="700" fill="#153b52">30% (n=20)</text>
<line x1="55" y1="193" x2="1145" y2="193" stroke="#d7e1e4"/>
<text x="347" y="248" text-anchor="end" font-family="Arial" font-size="17" fill="#153b52">Escherichia coli · Ciprofloxacin</text>
<rect x="365" y="221" width="755" height="30" rx="4" fill="#eef6f7"/>
<rect x="365" y="221" width="415.2" height="30" rx="4" fill="#087e8b"/>
<text x="790.2" y="243" font-family="Arial" font-size="15" font-weight="700" fill="#153b52">55% (n=20)</text>
<line x1="55" y1="270" x2="1145" y2="270" stroke="#d7e1e4"/>
<text x="347" y="325" text-anchor="end" font-family="Arial" font-size="17" fill="#153b52">Klebsiella pneumoniae · Ceftriaxone</text>
<rect x="365" y="298" width="755" height="30" rx="4" fill="#eef6f7"/>
<rect x="365" y="298" width="302.0" height="30" rx="4" fill="#087e8b"/>
<text x="677.0" y="320" font-family="Arial" font-size="15" font-weight="700" fill="#153b52">40% (n=20)</text>
<line x1="55" y1="347" x2="1145" y2="347" stroke="#d7e1e4"/>
<text x="347" y="402" text-anchor="end" font-family="Arial" font-size="17" fill="#153b52">Klebsiella pneumoniae · Ciprofloxacin</text>
<rect x="365" y="375" width="755" height="30" rx="4" fill="#eef6f7"/>
<rect x="365" y="375" width="151.0" height="30" rx="4" fill="#087e8b"/>
<text x="526.0" y="397" font-family="Arial" font-size="15" font-weight="700" fill="#153b52">20% (n=20)</text>
<line x1="55" y1="424" x2="1145" y2="424" stroke="#d7e1e4"/>
<text x="347" y="479" text-anchor="end" font-family="Arial" font-size="17" fill="#153b52">Staphylococcus aureus · Cefoxitin</text>
<rect x="365" y="452" width="755" height="30" rx="4" fill="#eef6f7"/>
<rect x="365" y="452" width="264.2" height="30" rx="4" fill="#087e8b"/>
<text x="639.2" y="474" font-family="Arial" font-size="15" font-weight="700" fill="#153b52">35% (n=20)</text>
<line x1="55" y1="501" x2="1145" y2="501" stroke="#d7e1e4"/>
<text x="742" y="550" text-anchor="middle" font-family="Arial" font-size="15" fill="#59686e">Resistant results (R) / all classified tests in each synthetic pair</text>
</svg>