<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 260" role="img" aria-labelledby="t d"><title id="t">Clinical microbiology workflow overview</title><desc id="d">Specimen reception, direct examination, culture and identification, susceptibility testing, quality review and validated reporting. Conceptual workflow only.</desc><rect width="100%" height="100%" fill="#fff"/><text x="32" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#153b52">Workflow de microbiologie clinique - cadre conceptuel</text><text x="32" y="60" font-family="Arial" font-size="12" fill="#59686e">Repères de processus, pas un protocole opératoire ni une activité déclarée.</text><rect x="30" y="100" width="180" height="100" rx="7" fill="#f3f8f9" stroke="#9dbbc2" stroke-width="2"/><circle cx="55" cy="125" r="15" fill="#087e8b"/><text x="55" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">01</text><text x="120" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#153b52">Recevoir</text><text x="120" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#59686e">identite - integrite</text><path d="M212 150 h18 l-7 -6 m7 6 l-7 6" fill="none" stroke="#087e8b" stroke-width="2"/><rect x="237" y="100" width="180" height="100" rx="7" fill="#f3f8f9" stroke="#9dbbc2" stroke-width="2"/><circle cx="262" cy="125" r="15" fill="#087e8b"/><text x="262" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">02</text><text x="327" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#153b52">Examiner</text><text x="327" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#59686e">direct - coloration</text><path d="M419 150 h18 l-7 -6 m7 6 l-7 6" fill="none" stroke="#087e8b" stroke-width="2"/><rect x="444" y="100" width="180" height="100" rx="7" fill="#f3f8f9" stroke="#9dbbc2" stroke-width="2"/><circle cx="469" cy="125" r="15" fill="#087e8b"/><text x="469" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">03</text><text x="534" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#153b52">Cultiver / identifier</text><text x="534" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#59686e">milieu - isolement</text><path d="M626 150 h18 l-7 -6 m7 6 l-7 6" fill="none" stroke="#087e8b" stroke-width="2"/><rect x="651" y="100" width="180" height="100" rx="7" fill="#f3f8f9" stroke="#9dbbc2" stroke-width="2"/><circle cx="676" cy="125" r="15" fill="#087e8b"/><text x="676" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">04</text><text x="741" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#153b52">Tester</text><text x="741" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#59686e">AST si indique</text><path d="M833 150 h18 l-7 -6 m7 6 l-7 6" fill="none" stroke="#087e8b" stroke-width="2"/><rect x="858" y="100" width="180" height="100" rx="7" fill="#f3f8f9" stroke="#9dbbc2" stroke-width="2"/><circle cx="883" cy="125" r="15" fill="#087e8b"/><text x="883" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">05</text><text x="948" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#153b52">Valider / transmettre</text><text x="948" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#59686e">QC - contexte</text></svg>