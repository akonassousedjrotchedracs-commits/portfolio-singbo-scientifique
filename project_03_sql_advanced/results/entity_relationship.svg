<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" role="img" aria-labelledby="t d"><title id="t">Schéma relationnel du projet SQL</title><desc id="d">Entités Organism, Isolate, Antibiotic et Susceptibility Result avec leurs clés et cardinalités.</desc><rect width="100%" height="100%" fill="#fff"/><text x="40" y="45" font-family="Arial" font-size="25" fill="#153b52">Modèle relationnel · clés et relations</text><g transform="translate(50,100)"><rect width="220" height="130" rx="12" fill="#f1f7f8" stroke="#087e8b" stroke-width="2"/><rect width="220" height="36" rx="12" fill="#d9eef0"/><text x="16" y="25" font-family="Arial" font-size="17" font-weight="bold" fill="#153b52">Organism</text><text x="16" y="66" font-family="monospace" font-size="13" fill="#153b52">PK organism_id</text><text x="16" y="93" font-family="monospace" font-size="13" fill="#153b52">UNIQUE name</text></g><g transform="translate(400,100)"><rect width="220" height="130" rx="12" fill="#f1f7f8" stroke="#087e8b" stroke-width="2"/><rect width="220" height="36" rx="12" fill="#d9eef0"/><text x="16" y="25" font-family="Arial" font-size="17" font-weight="bold" fill="#153b52">Isolate</text><text x="16" y="66" font-family="monospace" font-size="13" fill="#153b52">PK isolate_id</text><text x="16" y="93" font-family="monospace" font-size="13" fill="#153b52">FK organism_id</text></g><g transform="translate(780,100)"><rect width="220" height="130" rx="12" fill="#f1f7f8" stroke="#087e8b" stroke-width="2"/><rect width="220" height="36" rx="12" fill="#d9eef0"/><text x="16" y="25" font-family="Arial" font-size="17" font-weight="bold" fill="#153b52">Antibiotic</text><text x="16" y="66" font-family="monospace" font-size="13" fill="#153b52">PK antibiotic_id</text><text x="16" y="93" font-family="monospace" font-size="13" fill="#153b52">UNIQUE name</text></g><g transform="translate(400,270)"><rect width="220" height="130" rx="12" fill="#f1f7f8" stroke="#087e8b" stroke-width="2"/><rect width="220" height="36" rx="12" fill="#d9eef0"/><text x="16" y="25" font-family="Arial" font-size="17" font-weight="bold" fill="#153b52">SusceptibilityResult</text><text x="16" y="66" font-family="monospace" font-size="13" fill="#153b52">PK result_id</text><text x="16" y="93" font-family="monospace" font-size="13" fill="#153b52">FK isolate + antibiotic</text></g><path d="M270 165 H400 M620 165 H780 M510 230 V270 M890 230 H620 V270" fill="none" stroke="#59686e" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59686e"/></marker></defs><text x="50" y="390" font-family="Arial" font-size="14" fill="#59686e">FK = clé étrangère · contraintes et cardinalités sont appliquées par les tables SQLite du pipeline.</text></svg>