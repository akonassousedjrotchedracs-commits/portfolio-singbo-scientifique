<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Workflow · project 02 bacterial sequence</title>
<desc id="desc">Four sequential stages with explicit quality and interpretation rules.</desc>
<rect width="1200" height="390" rx="18" fill="#f5fafb"/>
<text x="55" y="55" font-family="Arial" font-size="27" font-weight="700" fill="#153b52">Protocole reproductible · 4 étapes</text>
<rect x="45" y="95" width="260" height="235" rx="14" fill="#fff" stroke="#b7dce2" stroke-width="2"/>
<circle cx="81" cy="132" r="21" fill="#087e8b"/>
<text x="81" y="138" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">01</text>
<text x="112" y="138" font-family="Arial" font-size="19" font-weight="700" fill="#153b52">Parser FASTA</text>

<text x="65" y="183" font-family="Arial" font-size="14" fill="#42545b">Chaque entrée commence par</text>
<text x="65" y="206" font-family="Arial" font-size="14" fill="#42545b">un en-tête > non vide;</text>
<text x="65" y="229" font-family="Arial" font-size="14" fill="#42545b">concaténer les lignes de</text>
<text x="65" y="252" font-family="Arial" font-size="14" fill="#42545b">séquence.</text>
<path d="M 312 210 H 331" stroke="#087e8b" stroke-width="4"/><path d="M 325 203 L 333 210 L 325 217" fill="none" stroke="#087e8b" stroke-width="4"/>
<rect x="335" y="95" width="260" height="235" rx="14" fill="#fff" stroke="#b7dce2" stroke-width="2"/>
<circle cx="371" cy="132" r="21" fill="#087e8b"/>
<text x="371" y="138" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">02</text>
<text x="402" y="138" font-family="Arial" font-size="19" font-weight="700" fill="#153b52">Contrôler</text>

<text x="355" y="183" font-family="Arial" font-size="14" fill="#42545b">Alphabet attendu A/C/G/T/N;</text>
<text x="355" y="206" font-family="Arial" font-size="14" fill="#42545b">dénombrer les bases</text>
<text x="355" y="229" font-family="Arial" font-size="14" fill="#42545b">ambiguës N.</text>
<path d="M 602 210 H 621" stroke="#087e8b" stroke-width="4"/><path d="M 615 203 L 623 210 L 615 217" fill="none" stroke="#087e8b" stroke-width="4"/>
<rect x="625" y="95" width="260" height="235" rx="14" fill="#fff" stroke="#b7dce2" stroke-width="2"/>
<circle cx="661" cy="132" r="21" fill="#087e8b"/>
<text x="661" y="138" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">03</text>
<text x="692" y="138" font-family="Arial" font-size="19" font-weight="700" fill="#153b52">Mesurer</text>

<text x="645" y="183" font-family="Arial" font-size="14" fill="#42545b">GC = (G+C)/(A+C+G+T); les N</text>
<text x="645" y="206" font-family="Arial" font-size="14" fill="#42545b">ne sont pas au</text>
<text x="645" y="229" font-family="Arial" font-size="14" fill="#42545b">dénominateur.</text>
<path d="M 892 210 H 911" stroke="#087e8b" stroke-width="4"/><path d="M 905 203 L 913 210 L 905 217" fill="none" stroke="#087e8b" stroke-width="4"/>
<rect x="915" y="95" width="260" height="235" rx="14" fill="#fff" stroke="#b7dce2" stroke-width="2"/>
<circle cx="951" cy="132" r="21" fill="#087e8b"/>
<text x="951" y="138" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">04</text>
<text x="982" y="138" font-family="Arial" font-size="19" font-weight="700" fill="#153b52">Explorer</text>

<text x="935" y="183" font-family="Arial" font-size="14" fill="#42545b">Chercher ATG puis stop en</text>
<text x="935" y="206" font-family="Arial" font-size="14" fill="#42545b">phase, sur le brin avant</text>
<text x="935" y="229" font-family="Arial" font-size="14" fill="#42545b">seulement; ne pas annoter.</text>
<text x="55" y="365" font-family="Arial" font-size="13" fill="#59686e">Démonstration sur données synthétiques · chaque sortie est téléchargeable depuis cette fiche</text>
</svg>